openapi: 3.0.3
info:
  title: CampusEats Catalogue Service
  version: 1.0.0
  description: REST API for the CampusEats food catalogue.
servers:
  - url: http://localhost:5000
paths:
  /menu-items:
    post:
      summary: Create a menu item
      operationId: createMenuItem
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemCreate'
      responses:
        '201':
          description: Menu item created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      summary: List or filter menu items
      operationId: listMenuItems
      parameters:
        - in: query
          name: category
          schema:
            type: string
        - in: query
          name: available
          schema:
            type: boolean
      responses:
        '200':
          description: Matching menu items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
  /menu-items/{item_id}:
    get:
      summary: Get one menu item
      operationId: getMenuItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Menu item found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'
  /menu-items/{item_id}/availability:
    patch:
      summary: Change menu item availability
      operationId: changeAvailability
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityUpdate'
      responses:
        '200':
          description: Availability changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  parameters:
    ItemId:
      name: item_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    MenuItemCreate:
      type: object
      required: [name, category, price]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1
        price:
          type: number
          format: float
          minimum: 0
        available:
          type: boolean
          default: true
    AvailabilityUpdate:
      type: object
      required: [available]
      additionalProperties: false
      properties:
        available:
          type: boolean
    MenuItem:
      type: object
      required: [id, name, category, price, available]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
        price:
          type: number
          format: float
        available:
          type: boolean
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Domain rejected a valid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
