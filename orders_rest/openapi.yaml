openapi: 3.0.3
info:
  title: CampusEats Orders REST Service
  version: 1.0.0
  description: REST implementation of the CampusEats Orders service.
servers:
  - url: http://localhost:8000
paths:
  /orders:
    post:
      summary: Create an order
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      summary: List orders, optionally filtered by status
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Matching orders
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /orders/{orderId}:
    get:
      summary: Read one order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cancellation:
    post:
      summary: Cancel an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    CreateOrderRequest:
      type: object
      required: [user_id, items]
      properties:
        user_id:
          type: integer
          format: int64
        items:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required: [item_id, name, unit_price, quantity]
      properties:
        item_id:
          type: integer
          format: int64
        name:
          type: string
        unit_price:
          type: number
          format: double
          exclusiveMinimum: 0
        quantity:
          type: integer
          minimum: 1
    Order:
      type: object
      required: [id, user_id, items, total_amount, status, created_at, payment_reference]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total_amount:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/OrderStatus'
        created_at:
          type: string
          format: date-time
        payment_reference:
          type: string
          nullable: true
    OrderStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED]
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: State conflict
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    UnprocessableEntity:
      description: Domain rejects a valid request
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: Payment dependency unavailable
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Problem'}
